name: Release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every ID we ship still has to exist: a broken pack must not reach the marketplace.
      - run: pnpm verify:ids

      # Opens or updates the version PR; when that PR lands, publish runs on the next push.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          commit: "chore: version packs"
          title: "chore: version packs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changed packs
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm publish:changed
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
