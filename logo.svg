<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="58" fill="#15171C"/>

  <g transform="translate(0 -10)">
    <!-- Fins carry a ground-coloured outline: same tint as the hull, they would
         otherwise melt into it at small sizes. -->
    <path d="M 98 120 L 58 180 L 98 170 Z" fill="#8B95A8" opacity="0.5"
          stroke="#15171C" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 158 120 L 198 180 L 158 170 Z" fill="#8B95A8" opacity="0.5"
          stroke="#15171C" stroke-width="6" stroke-linejoin="round"/>

    <path d="M 128 32 C 152 64 158 104 158 144 L 158 168 L 98 168 L 98 144 C 98 104 104 64 128 32 Z" fill="#8B95A8"/>
    <circle cx="128" cy="94" r="17" fill="#15171C"/>
    <rect x="111" y="171" width="34" height="11" rx="4" fill="#8B95A8" opacity="0.75"/>

    <!-- exhaust: the same three layers as the packs -->
    <path d="M 100 218 L 128 196 L 156 218" fill="none" stroke="#8B95A8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M 100 240 L 128 218 L 156 240" fill="none" stroke="#8B95A8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
  </g>
</svg>